<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REWIRE QR generator</title>
<style>body{font:16px/1.5 ui-monospace,monospace;background:#8a42fb;color:#fff;max-width:520px;margin:2rem auto;padding:0 1rem}
input,select,button{font:inherit;padding:.6rem;width:100%;margin:.3rem 0 1rem;border:3px solid #2a1d75}
button{background:#b0ff3c;font-weight:700;cursor:pointer;width:auto;margin-right:.5rem}
#qr{background:#fff;padding:20px;display:inline-block;border:4px solid #b0ff3c}#qr svg{width:300px;height:300px;display:block}</style></head>
<body><h1>REWIRE QR generator</h1>
<label>Your live website URL<input id="u" placeholder="https://your-site.netlify.app"></label>
<label>Error correction<select id="e"><option value="Q">Q (good for print)</option><option value="H">H (best if scuffed)</option><option value="M">M (simplest code)</option></select></label>
<div id="qr"></div><p></p>
<button id="s">Download SVG</button><button id="p">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const u=document.getElementById('u'),e=document.getElementById('e'),box=document.getElementById('qr');let svg='';
function draw(){if(!u.value){box.textContent='Enter your URL above';svg='';return}
const q=qrcode(0,e.value);q.addData(u.value.trim());q.make();
svg=q.createSvgTag({cellSize:10,margin:4,scalable:true}).replace('<svg','<svg shape-rendering="crispEdges"').replace(/fill="black"/g,'fill="#1d1550"');box.innerHTML=svg}
function save(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
u.oninput=e.onchange=draw;draw();
document.getElementById('s').onclick=()=>svg&&save('rewire-qr.svg',new Blob([svg],{type:'image/svg+xml'}));
document.getElementById('p').onclick=()=>{if(!svg)return;const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1200;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1200,1200);x.imageSmoothingEnabled=false;x.drawImage(i,0,0,1200,1200);c.toBlob(b=>save('rewire-qr.png',b))};i.src='data:image/svg+xml;base64,'+btoa(svg)}
</script></body></html>
